<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Coefficient</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>NIR COEFFICIENT ADDITION</h1>
      <p>Add a single float value to all items in a list</p>
    </header>

    <main>
      <label for="inputA">Enter comma-separated values (a):</label>
      <textarea id="inputA" placeholder="e.g., 10.0, 20.0, 30.0"></textarea>

      <label for="inputB">Enter a coefficient (b):</label>
      <input type="number" step="any" id="inputB" placeholder="e.g., 5" />

      <button onclick="submitAddition()"><i class="fas fa-plus-circle"></i> Add Coefficient</button>
      <div class="output" id="output"></div>
      <button id="copyBtn" class="copy-button" onclick="copyOutput()" style="display: none;"><i class="fas fa-copy"></i> Copy Output</button>
    </main>

    <footer>
      <div class="theme-toggle">
        <label class="switch">
          <input type="checkbox" id="theme-checkbox">
          <span class="slider"></span>
        </label>
        <span id="theme-toggle">Light/Dark Mode</span>
      </div>
    </footer>
    

  <script src="script.js"></script>
   <script>
  // Theme Toggle
  const toggle = document.getElementById("theme-toggle");
  const themeCheckbox = document.getElementById("theme-checkbox");

  function setTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("theme", theme);
    themeCheckbox.checked = theme === "dark";
  }

  themeCheckbox.addEventListener("change", () => {
    setTheme(themeCheckbox.checked ? "dark" : "light");
  });

  // Load saved theme on page load
  const savedTheme = localStorage.getItem("theme") || "light";
  setTheme(savedTheme);

  // Copy Button
  const copyBtn = document.getElementById("copy-btn");
  const resultBox = document.getElementById("result");

  if (copyBtn && resultBox) {
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(resultBox.innerText).then(() => {
        copyBtn.innerText = "Copied!";
        setTimeout(() => {
          copyBtn.innerText = "Copy Output";
        }, 1500);
      });
    });
  }
</script>

</body>
</html>
